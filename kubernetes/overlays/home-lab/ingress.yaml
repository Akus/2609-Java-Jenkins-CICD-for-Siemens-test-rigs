# One Ingress per UI, all on ingress-nginx's MetalLB IP. *.lab.akos-demo.com is a public
# Route53 A record pointing at that IP (`kubectl -n ingress-nginx get svc
# ingress-nginx-controller`), so it only resolves to something reachable from the LAN.
# HTTPS with the Let's Encrypt wildcard cert from certificate.yaml; ingress-nginx redirects
# HTTP to HTTPS once a tls: block is set.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jenkins
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 50m # artifact/plugin uploads
spec:
  ingressClassName: nginx
  tls:
    - hosts: [jenkins.lab.akos-demo.com]
      secretName: lab-wildcard-tls
  rules:
    - host: jenkins.lab.akos-demo.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jenkins
                port:
                  name: http
