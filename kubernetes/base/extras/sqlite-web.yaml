# coleifer/sqlite-web only publishes an amd64 image as of writing – confirm it has an arm64
# variant (or build one) before deploying this on the Pi cluster. See kubernetes/README.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sqlite-web
  labels:
    app.kubernetes.io/name: sqlite-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sqlite-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sqlite-web
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sqlite-web
          image: coleifer/sqlite-web:latest
          command: [sqlite_web, --host, "0.0.0.0", --port, "8080", --read-only, /data/rigs.db]
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rig-api-data
---
apiVersion: v1
kind: Service
metadata:
  name: sqlite-web
  labels:
    app.kubernetes.io/name: sqlite-web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: sqlite-web
  ports:
    - name: http
      port: 8081
      targetPort: http
