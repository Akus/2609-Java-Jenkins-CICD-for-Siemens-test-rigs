apiVersion: apps/v1
kind: Deployment
metadata:
  name: rig-vienna-02
  labels:
    app.kubernetes.io/name: rig-vienna-02
    rig.lab: vienna
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rig-vienna-02
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rig-vienna-02
        rig.lab: vienna
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rig-sim
          image: rig-sim
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: RIG_ID
              value: rig-vienna-02
            - name: RIG_LAB
              value: vienna
            - name: FAIL_RATE
              value: "0.02"
            - name: FLASH_SECONDS
              value: "8"
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
          resources:
            requests:
              cpu: 25m
              memory: 48Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: rig-vienna-02
  labels:
    app.kubernetes.io/name: rig-vienna-02
    rig.lab: vienna
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: rig-vienna-02
  ports:
    - name: http
      port: 8080
      targetPort: http
