# Jenkins Configuration as Code – everything the lab needs, reproducible on every boot.
# Secrets come from the container environment (docker-compose.yml / .env).
# LAB_REPO_URL and JENKINS_PUBLIC_URL are unset under compose (-> bind-mounted file:///repo and
# localhost); kubernetes/ sets them to the GitHub remote and the Ingress hostname.
jenkins:
  systemMessage: "HIL test-rig lab – Jenkins configured by JCasC. Rigs are Lockable Resources; the rig broker is at ${RIG_API_URL}."
  numExecutors: 0                      # controller never builds – all work runs on lab agents
  mode: EXCLUSIVE
  slaveAgentPort: 50000
  remotingSecurity:
    enabled: true

  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_ID}"
          password: "${JENKINS_ADMIN_PASSWORD}"
          name: "Lab Admin"

  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: true         # dashboards/links work without login; changes need login

  crumbIssuer:
    standard:
      excludeClientIPFromCrumb: true

  globalNodeProperties:
    - envVars:
        env:
          - key: RIG_API_URL
            value: "${RIG_API_URL}"

  # One inbound agent "physically near the rigs". Its container self-registers (see jenkins/agent/entrypoint.sh).
  nodes:
    - permanent:
        name: lab-agent
        labelString: "lab vienna munich"
        numExecutors: 2
        mode: NORMAL
        remoteFS: /home/jenkins/agent
        retentionStrategy: always
        launcher:
          inbound:
            webSocket: true
            workDirSettings:
              disabled: false
              failIfWorkDirIsMissing: false
              internalDir: remoting

credentials:
  system:
    domainCredentials:
      - credentials:
          # Used by the watchdog job to talk to the Lockable Resources endpoints.
          - usernamePassword:
              scope: GLOBAL
              id: jenkins-admin
              description: "Jenkins admin (lab automation)"
              username: "${JENKINS_ADMIN_ID}"
              password: "${JENKINS_ADMIN_PASSWORD}"

security:
  # Job DSL scripts below are trusted (they come from this file, not from users).
  globalJobDslSecurityConfiguration:
    useScriptSecurity: false

unclassified:
  location:
    url: "${JENKINS_PUBLIC_URL:-http://localhost:8080/}"
    adminAddress: "lab-admin@example.invalid"

  # ---- Rig locks: one lockable resource per physical rig -------------------
  # `lock(label: 'vienna', quantity: 1, variable: 'RIG')` in the Jenkinsfile picks a free one.
  lockableResourcesManager:
    declaredResources:
      - name: rig-vienna-01
        description: "Test rig board, Vienna lab, bay 1 (simulated: http://rig-vienna-01:8080)"
        labels: "rig vienna"
      - name: rig-vienna-02
        description: "Test rig board, Vienna lab, bay 2 (simulated: http://rig-vienna-02:8080)"
        labels: "rig vienna"
      - name: rig-munich-01
        description: "Test rig board, Munich lab, bay 1 (simulated: http://rig-munich-01:8080)"
        labels: "rig munich"

  # ---- Prometheus plugin: scraped by monitoring/prometheus/prometheus.yml ----
  prometheusConfiguration:
    path: prometheus
    useAuthenticatedEndpoint: false
    collectingMetricsPeriodInSeconds: 15
    defaultNamespace: default
    jobAttributeName: jenkins_job
    countAbortedBuilds: true
    countFailedBuilds: true
    countNotBuiltBuilds: true
    countSuccessfulBuilds: true
    countUnstableBuilds: true
    fetchTestResults: true
    processingDisabledBuilds: false
    appendParamLabel: false
    appendStatusLabel: false
    perBuildMetrics: true

  timestamper:
    allPipelines: true

# ---- Jobs (Job DSL) ----------------------------------------------------------
jobs:
  - script: |
      pipelineJob('rig-hil-pipeline') {
        displayName('Rig HIL pipeline (build → reserve → flash → HIL tests → release)')
        description('''Builds the rig firmware (rig-sim), reserves a free rig in the chosen lab
      via Lockable Resources + the rig broker API, flashes it, runs the JUnit HIL suite against it
      and always releases the rig afterwards. Pipeline source: Jenkinsfile on main of ${LAB_REPO_URL:-file:///repo}
      (committed content only).''')
        logRotator { numToKeep(30) }
        parameters {
          choiceParam('LAB', ['vienna', 'munich'], 'Which lab to reserve a rig in')
          stringParam('FIRMWARE_VERSION', '', 'Firmware version to flash; empty = 1.0.<build number>')
          booleanParam('QUARANTINE_ON_FAILURE', true, 'Quarantine the rig via the broker if HIL tests fail and the rig is not IDLE afterwards')
        }
        definition {
          cpsScm {
            scm {
              git {
                remote { url('${LAB_REPO_URL:-file:///repo}') }
                branch('*/main')
                extensions {
                  cloneOptions { shallow(true); depth(1) }
                }
              }
            }
            scriptPath('Jenkinsfile')
            lightweight(true)
          }
        }
      }

  - script: |
      pipelineJob('rig-watchdog') {
        displayName('Rig watchdog (release stuck locks, sync quarantine → Jenkins)')
        description('Every 10 min: asks the broker for quarantined rigs and reserves the matching Lockable Resource so no job can pick it up; frees it again when the rig is back in service.')
        properties {
          pipelineTriggers { triggers { cron { spec('H/10 * * * *') } } }
        }
        definition {
          cpsScm {
            scm {
              git {
                remote { url('${LAB_REPO_URL:-file:///repo}') }
                branch('*/main')
              }
            }
            scriptPath('jenkins/pipelines/watchdog.Jenkinsfile')
            lightweight(true)
          }
        }
      }
