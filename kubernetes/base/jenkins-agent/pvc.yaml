apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agent-workdir
  labels:
    app.kubernetes.io/name: jenkins-agent
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: maven-repo
  labels:
    app.kubernetes.io/name: jenkins-agent
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
