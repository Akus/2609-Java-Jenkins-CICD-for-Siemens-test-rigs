name: image rig-sim

on:
  push:
    branches: [main]
    paths:
      - rig-sim/**
      - .github/workflows/image-rig-sim.yml
      - .github/workflows/build-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    uses: ./.github/workflows/build-image.yml
    with:
      image: 2609-rig-sim
      context: rig-sim
